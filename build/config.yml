version: '3'

info:
  companyName: "xianii"
  productName: "Wails Demo"
  productIdentifier: "com.xianii.wails-demo"
  description: "Wails Svelte DaisyUI Tailwindcss Template"
  copyright: "(c) 2026, xianii"
  comments: "Wails Svelte DaisyUI Template"
  version: "0.1.0"

dev_mode:
  root_path: .
  log_level: warn
  debounce: 1000
  ignore:
    dir:
      - .git
      - node_modules
      - frontend
      - bin
    file:
      - .DS_Store
      - .gitignore
      - .gitkeep
      - "*_test.go"
    watched_extension:
      - "*.go"
    git_ignore: true
  executes:
    - cmd: wails3 task dev:build
      type: blocking
    - cmd: wails3 generate bindings
      type: blocking
    - cmd: wails3 task common:dev:frontend
      type: background
    - cmd: wails3 task run
      type: primary
